# Merge into main => tests, build, publish to npm (skipped when this version is already published),
# then a GitHub release tagged vX.Y.Z from package.json.
# Requires the repository secret NPM_TOKEN (an npm "Automation" token of the @agentlinkprotocol org).
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  id-token: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - id: meta
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: exists
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"; echo "::notice::${{ steps.meta.outputs.version }} already on npm, skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rev-parse "$TAG" >/dev/null 2>&1 || { git tag "$TAG" && git push origin "$TAG"; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "${{ steps.meta.outputs.name }} $TAG" --generate-notes
          npm pack --silent && gh release upload "$TAG" ./*.tgz --clobber
          git tag -f latest && git push -f origin latest
